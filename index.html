<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f6ef" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#12271e" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Make room for what matters. A private, simple Eisenhower Matrix."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Clearspace · Eisenhower Matrix</title>
  </head>
  <body>
    <!-- Apply the saved theme before first paint so dark mode never flashes light. -->
    <script>
      try {
        var saved = localStorage.getItem('clearspace.theme');
        var dark =
          saved === 'night' ||
          (saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) {
          document.documentElement.classList.add('night');
          document.body.classList.add('night');
          document.documentElement.style.colorScheme = 'dark';
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (meta) {
            meta.content = '#12271e';
          });
        }
      } catch (e) {
        /* Storage can be blocked; the app falls back to light. */
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
